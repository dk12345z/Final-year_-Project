[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lc25000-hybrid-classifier"
version = "0.1.0"
description = "Adaptive hybrid CNN + handcrafted feature framework for LC25000 histopathology classification"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9",
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26,<3",
  "Pillow>=10",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "opencv-python-headless>=4.9",
  "matplotlib>=3.8",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
